
name: Playwright QA Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run UI and API Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test

      - name: Upload test reports as GitHub artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-reports
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Configure AWS credentials using OIDC
        id: aws-credentials
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::670341164156:role/GitHubActionsQAReportsRole
          aws-region: ap-south-1

      - name: Upload reports to S3
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.aws-credentials.outcome == 'success'
        run: |
          REPORT_PATH="playwright/${GITHUB_RUN_NUMBER}-${GITHUB_SHA}"

          aws s3 sync playwright-report/ "s3://qa-automation-reports-123/${REPORT_PATH}/html/"
          aws s3 sync test-results/ "s3://qa-automation-reports-123/${REPORT_PATH}/test-results/"
